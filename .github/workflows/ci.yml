name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_MODE: mock
      ROBOT_EXECUTION_MODE: mock
      ENABLE_HARDWARE_EXECUTION: "false"
      ROBOT_BACKEND: mock
      ENABLE_REAL_ROBOT: "false"
      DRY_RUN: "true"
      ENABLE_HANDEYE_CALIBRATION: "false"
      CALIBRATION_POSE_PLAN_APPROVED: "false"
      CALIBRATION_CELL_SAFETY_VERIFIED: "false"
      ENABLE_WEB_JOG: "false"
      JOG_CELL_SAFETY_VERIFIED: "false"
      ENABLE_ARUCO_EXPERIMENT: "false"
      ARUCO_EXPERIMENT_CELL_SAFETY_VERIFIED: "false"
      ARTIFACT_ROOT: ${{ runner.temp }}/robot-skill-artifacts
      DATABASE_URL: sqlite:///${{ runner.temp }}/robot-skills.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,api,perception]"

      - name: Compile Python sources
        run: python -m compileall src tests aruco

      - name: Check launcher syntax
        run: bash -n run_terminal1_doosan_rviz.sh run_terminal2_hardware_ui.sh

      - name: Verify frozen geometry artifacts
        run: sha256sum -c aruco/PORTABLE_ARTIFACTS.sha256

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Run offline demo
        run: python -m robot_skill_system.cli demo-e2e
