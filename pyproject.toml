[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-skill-system"
version = "0.1.0"
description = "Safety-bounded robot skill teaching, compilation, registry, and execution MVP"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "openai>=1.98,<3",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "Pillow>=10,<13",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]
vision = ["mediapipe>=0.10,<1", "opencv-python-headless>=4.8,<5", "scipy>=1.10,<2"]
perception = ["opencv-python-headless>=4.8,<5", "scipy>=1.10,<2"]
realsense = [
  "opencv-python-headless>=4.8,<5",
  "pyrealsense2>=2.58,<2.59",
]
dev = [
  "coverage[toml]>=7,<8",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
robot-skill = "robot_skill_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# These pre-existing hardware/diagnostic utilities are kept under their legacy
# lint baseline. Core code, tests, examples, and new ArUco utilities remain fully checked.
[tool.ruff.lint.per-file-ignores]
"aruco/_debug_detect.py" = ["B007", "F401"]
"aruco/aruco_planar_coords.py" = ["B905", "I001"]
"aruco/d435i_aruco_plane.py" = ["B905", "E501", "I001"]
"aruco/d435i_plane_workspace_scan.py" = ["B905", "E501", "I001"]
"aruco/d435i_stream_diagnostic.py" = ["E501", "F841", "SIM105"]
"aruco/freeze_fixed_aruco_workspace.py" = ["SIM105"]
"aruco/object_width_workspace.py" = ["SIM105"]
"aruco/test_object_width_workspace.py" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["robot_skill_system"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pyrealsense2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aruco.object_width_workspace"]
follow_imports = "skip"
